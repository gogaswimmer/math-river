<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155c70"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math River"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Math River</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div><div class="eyebrow">🐟 MATH RIVER</div><h1 id="title"></h1></div><div class="headright"><select id="lang" aria-label="Language"><option value="ru">🇷🇺 Русский</option><option value="uk">🇺🇦 Українська</option><option value="nl">🇳🇱 Nederlands</option></select><div class="pearls">🫧 <span id="pearls">0</span></div></div></header><section class="aquarium"><div class="light"></div><div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div><div class="fish-area" id="fish-area"></div><div class="riverbed"></div><div class="reed r1">♧</div><div class="reed r2">♧</div><div class="stone s1"></div><div class="stone s2"></div><div class="aquarium-label" id="aquarium-label"></div></section><nav class="tabs"><button data-tab="play" class="active" id="tab-play"></button><button data-tab="shop" id="tab-shop"></button><button data-tab="feed" id="tab-feed"></button><button data-tab="errors" id="tab-errors"></button><button data-tab="records" id="tab-records"></button></nav><section class="panel" id="play"><div class="selectors"><label><span id="operation-label"></span><select id="operation"><option value="add"></option><option value="sub"></option><option value="mul"></option><option value="div"></option><option value="mix"></option></select></label><label><span id="difficulty-label"></span><select id="difficulty"><option value="easy"></option><option value="medium"></option><option value="hard"></option><option value="expert"></option></select></label><label><span id="mode-label"></span><select id="mode"><option value="practice"></option><option value="school"></option></select></label></div><div class="session-stats"><div><small id="session-label"></small><strong id="session-total">0</strong></div><div><small id="session-correct-label"></small><strong id="session-correct">0</strong></div><div><small id="session-wrong-label"></small><strong id="session-wrong">0</strong></div></div><button class="reset-session" id="reset-session"></button><div class="review-status" id="review-status"></div><div class="school-info hidden" id="school-info"><strong id="school-title"></strong><span id="school-description"></span></div><div class="timer-row hidden" id="timer-row"><span id="timer">02:00</span><span id="progress">0 / 36</span></div><button id="start" class="primary start hidden"></button><div class="question-card" id="question-card"><div class="question-caption" id="question-caption"></div><div class="question" id="question"></div><div class="answer-row"><input id="answer" type="text" inputmode="none" readonly autocomplete="off" placeholder="?" aria-label="Answer"><button id="check" class="primary"></button></div><div class="number-pad" id="number-pad" aria-label="Numeric keypad"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><button type="button" data-digit="sign">±</button><button type="button" data-digit="0">0</button><button type="button" data-digit="back" aria-label="Delete">⌫</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="primary hidden"></button></div><div class="stats"><div><strong id="correct">0</strong><span id="correct-label"></span></div><div><strong id="streak">0</strong><span id="streak-label"></span></div><div><strong id="best">0</strong><span id="best-label"></span></div></div><p id="hint" class="hint"></p></section><section id="shop" class="panel hidden"><p id="shop-hint" class="hint"></p><div id="shop-grid" class="shop-grid"></div></section><section id="feed" class="panel hidden"><h2 id="food-title"></h2><p id="food-hint" class="hint"></p><div id="food-grid" class="shop-grid"></div><h3>🐟</h3><div id="feeding-grid" class="shop-grid"></div></section><section id="errors" class="panel hidden"><h2 id="review-title"></h2><p id="review-hint" class="hint"></p><div class="session-stats"><div><small id="review-count-label"></small><strong id="review-count">0</strong></div><div><small id="review-done-label"></small><strong id="review-done">0</strong></div></div><div class="review-controls"><button class="primary" id="review-start"></button><button class="reset-session hidden" id="review-exit"></button></div><div id="mistakes-list" class="records"></div></section><section id="records" class="panel hidden"><h2 id="records-heading"></h2><div id="records-grid" class="records"></div><h3 id="school-records-heading"></h3><div id="school-records" class="records"></div><button id="reset" class="reset"></button></section><footer id="footer"></footer></main><script src="app.js" defer></script></body></html>
